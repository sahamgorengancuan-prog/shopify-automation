services:
  archivist:
    build: ..
    image: archivist:latest
    container_name: archivist
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      # Keys come from the host environment or a .env file next to this compose file.
      BFL_API_KEY: ${BFL_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      ARCHIVIST_RUNS_DIR: /app/runs
      ARCHIVIST_COLLECTION: ${ARCHIVIST_COLLECTION:-default}
    volumes:
      - archivist-runs:/app/runs

volumes:
  archivist-runs:
